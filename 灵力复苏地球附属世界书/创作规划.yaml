  玄天界势力态度: [天机阁地球策略, 万宝楼地球策略, 黑金阁地球策略, 大周仙朝地球策略, 蜀山剑门地球策略, 昆仑道门地球策略, 万法宗地球策略, 合欢宗地球策略, 大雷音寺地球策略, 广寒宫地球策略, 太阳神宫地球策略, 血神宫地球策略, 万魂殿地球策略, 尸魔宗地球策略, 妖族地球策略]
  女性人物接口: [宫银叶地球接口, 红莲地球接口, 黑姬结灯地球接口, 九歌地球接口, 显宝地球接口, 君姝地球接口, 云初未来地球接口, 海伊地球接口]
  货币与结算: [地球货币体系, 标准灵能计价体系, 跨界贸易与灵石汇率, 地下超凡交易体系]
  地球关键NPC:
    count: 72
    gender: {女性: 50, 男性: 22}
    composition:
      四大力量: 12
      其他区域力量: 6
      学校管理与教师: 8
      学生会与突出学生: 16
      五大财团: 10
      国际组织: 6
      民间组织: 5
      地下组织: 5
      相交秘境公共机构: 4
    source: 地球NPC数据.mjs
    detail_source: 地球NPC详情.mjs
    review_table: 地球关键NPC总表.md
    profile_fields: [姓名, 性别, 实际年龄, 外表年龄, 出生地, 出身与家庭, 归属, 职位, 体系与能力, 功法与技能关联, 外貌, 性格, 核心性格, 行事作风, 事迹, 公开目标, 私人矛盾, 理念与底线, 偏好与生活细节, 玩家接口, 语言特征, 动态变化边界, 运行边界]
    humanization_fields: [日常锚点, 表达与行动, 压力反应, 关系入口]
    detailed_profile_constraints:
      target_chars: 1000-1500
      unified_sections: [基本身份, 出身与关键背景, 修炼关联, 外貌识别, 性格结构, 行事作风, 理念与底线, 偏好与生活细节, 人际关系与玩家接口, 语言特征, 动态变化边界]
      linkage_rule: 功法与技能必须同时解释出生/成长环境、职业职责、能力表现和使用代价；不得只罗列技能名称
      supernatural_rule: 72名固定NPC均为修仙者、觉醒者、灵能者、术士、共鸣者或超凡技术使用者，不保留纯凡人能力标注
      apparent_age_rule: 灵力复苏后的修炼、觉醒与灵能调理会延缓外貌衰老；所有固定NPC均显得比实际年龄年轻，年轻学生保留下限明确的青年外貌，不写成未成年人
      personality_rule: 每人必须同时具有外在表现、内在底色、反差触发、压力行为和关系节奏；允许内冷外热、外柔内硬、嘴硬心软、傲娇、自持温柔、明朗敏感、礼貌疏离等矛盾组合，不用单一标签替代行为
      dialogue_rule: 每人提供5句纯对白，至少覆盖日常、拒绝、压力、合作与关系变化；对白需结合其职业、经历、能力代价和性格节奏
      density_rule: 同一日常行为、压力反应和关系入口不得在多个字段原句复写；通用运行边界集中表达，不以重复内容填充字数
