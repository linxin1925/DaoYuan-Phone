prose_refinement:
  mode: staged_structural_rewrite
  status: full_npc_candidate_generated
  candidate: 灵力复苏地球附属世界书-全量洗稿候选.json
  full_scope: 72名固定NPC全部采用专属或按人物资料差异化生成的决策习惯、底线表达、说话节奏与情境对白
  purpose: 去除人物档案中的统一模板腔、机械排比与重复解释，同时保留世界观事实、人物差异和技术结构
  protected: [条目名称, JSON结构, EJS, 变量路径, 数值, 设定事实, 能力代价, 人物关系, 运行边界]
  first_batch: [沈砚秋, 唐见川, 苏小满, 卡珊德拉·韦尔, 席若云, 伊芙琳·无声]
  first_batch_scope: 为六人补充专属决策习惯、底线表达、说话节奏和情境对白；其余NPC暂不改动，保留对照基线
  acceptance:
    - 五句对白仍覆盖日常、拒绝、压力、合作与关系变化，但不得继续套用同一语法骨架
    - 不新增既定事件，不改变动机、立场、能力边界和已确认经历
    - 生成后JSON可解析，72名固定NPC与10条EJS路由完整，受保护字段保持不变

world:
  overview: 地球与玄天界是相互独立的平行宇宙；现代地球发生灵力复苏，以科学教育、工业体系和多元超凡路线应对玄天界接触与噬界虫群入侵。
  opening_baseline:
    date: 以每次新游戏开场时的现实公历日期为准，不硬编码具体年份
    phase: 灵力复苏刚刚开始，长期逐年增强
    education: 第一所灵力学校在复苏发生后立即进入筹建期
    swarm: 仅有零星、未被完整确认的异常迹象
    crossworld: 两界尚未建立稳定联系，发现进度受玩家与各方行动影响
  crossworld_contract:
    time_ratio: 默认地球与玄天界时间流速1比1；允许玩家在小手机选择受控预设比例
    early_sequence: 意外人员穿越→相交秘境激活并建立信息联系→人员携物通行→多种后期方式
    intersection_realm: 天然存在且不能被两界永久关闭，后期可发展为跨界大城与贸易中心
    earth_suppression: 玄天界来客进入地球会受到地球天道压制
    swarm_route: 噬界虫群使用独立于相交秘境的通道
  player_boundary:
    - 不预设<user>出身、阵营、能力或使命
    - <user>可以是穿越者、玄天界本地人或其他合理身份
    - 世界提供开放局势，不设置必须依次完成的主线剧情
  red_lines:
    - 不覆盖原版世界书条目
    - 不编写具体触发条件
    - 不把地球设为玄天界附属位面
    - 不让地球只能被动接受玄天界处置
    - 地球关键NPC总体性别比例约为70%女性、30%男性，不机械限制单个场景

