  灵力学校: [中国综合修真大学体系, 美国灵能学院体系, 俄罗斯共鸣学院体系, 欧盟以太大学联盟]
  财团: [九州灵工联合体, 普罗米修斯生命集团, 赫尔墨斯以太工业, 极冠重工, 天穹轨道集团]
