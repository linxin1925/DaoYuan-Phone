<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17131f" />
    <title>紫薇 · 道渊桌宠</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="desktop-pet" data-pet-state="Idle">
      <div class="ambient ambient-left" aria-hidden="true"></div>
      <div class="ambient ambient-right" aria-hidden="true"></div>

      <section class="pet-stage" aria-label="紫薇桌宠">
        <div class="star-map" aria-hidden="true">✦　·　✧　　·　✦<br />　·　✧　·　　✦</div>
        <div class="pet-status" aria-live="polite"><span class="status-dot"></span><span id="state-label">Idle</span></div>
        <button class="pet-button" id="pet-button" type="button" aria-label="点击紫薇打开玉简">
          <span class="pet-aura" aria-hidden="true"></span>
          <span class="pet-visual" aria-hidden="true">
            <img data-pet-image hidden />
            <span class="pet-placeholder" data-pet-placeholder>紫薇 PNG<br /><small>待接入正式透明素材</small></span>
          </span>
          <span class="pet-name">紫薇</span>
          <span class="pet-hint">点击开启玉简</span>
        </button>
      </section>

      <section class="jade-slip" id="jade-slip" aria-labelledby="jade-title" aria-hidden="true">
        <div class="jade-glow" aria-hidden="true"></div>
        <header class="jade-header"><div><p class="eyebrow">DAOYUAN · JADE SLIP</p><h1 id="jade-title">紫薇玉简</h1></div><button class="icon-button" id="close-jade" type="button" aria-label="关闭玉简">×</button></header>
        <div class="jade-content"><p class="jade-greeting">“星河已为你铺开，今日想先观哪一处？”</p><div class="jade-grid"><button class="jade-card" type="button"><span>✦</span><strong>星盘</strong><small>今日星象</small></button><button class="jade-card" type="button"><span>◈</span><strong>灵签</strong><small>抽一支签</small></button><button class="jade-card" type="button"><span>☽</span><strong>静心</strong><small>三息入定</small></button></div><div class="jade-note"><span>当前灵力</span><strong>●●●●○</strong></div></div>
        <footer class="jade-footer"><span>玉简已连接</span><span>紫薇 · 守夜中</span></footer>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
